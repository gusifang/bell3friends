<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="t d">
<title id="t">The experimental arena</title>
<desc id="d">A circular orchestration: a physicist centrally prepares three systems, independently tested at three sites, then verifies recorded outcomes.</desc>
